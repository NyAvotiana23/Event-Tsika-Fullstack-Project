name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-tsika-back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: event-tsika-back/global.json
      - run: dotnet test --configuration Release

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-tsika
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: event-tsika/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          JWT_KEY: ci-build-only-key-ci-build-only-key-00
