<header class="topbar">
  <a routerLink="/" class="brand">E-Ventsika</a>
  <nav>
    @if (auth.isOrganizer()) {
      <a routerLink="/organisateur" routerLinkActive="active">Espace organisateur</a>
    }
    @if (auth.session(); as s) {
      <a routerLink="/mes-billets" routerLinkActive="active">Mes billets</a>
      <span class="muted">{{ s.displayName }}</span>
      <button type="button" class="secondary" (click)="auth.logout()">Déconnexion</button>
    } @else {
      <a routerLink="/connexion" routerLinkActive="active">Connexion</a>
      <a routerLink="/inscription" class="button">Inscription</a>
    }
  </nav>
</header>
<main>
  <router-outlet />
</main>
<footer class="muted">E-Ventsika — découvrir et organiser des événements à Madagascar</footer>
